# Independent mining; the trainer only reads the resulting indices.
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
data_root: ${oc.env:L76_DATA_ROOT}
output_dir: temp/l76_run/pairs
archive_path: null
seed: 20260927
chunk_size: 100
exclude_before:
  colmap_rgbd_half_s0: 200
frame_exclusions: []
split_chunks:
  train: [0, 1, 2, 3, 4, 5]
  guard: [6, 8]
  val: [7]
  test: [9]
min_frames:
  train: 100
  val: 60
  test: 60
candidate_max_gap: 60
train_max_gap: 30
max_rotation_deg: 15.0
min_translation_m: 0.005
max_translation_m: 1.0
train_overlap: [0.2, 0.85]
overlap_bins: [0.2, 0.3, 0.5, 0.7, 0.85]
bin_weights: [0.25, 0.35, 0.25, 0.15]
eval_gaps: [1, 5, 10, 20, 30, 40]
eval_pairs_per_bin: 12
smoke_per_subset: 4
stride: 8
depth_tolerance: 0.03
leak_overlap: 0.2
